name: CI

on: [push, pull_request]

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }}, java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.12']
        java: ['21']
        include:
          - os: windows-latest
            python-version: '3.12'
            java: '8'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ matrix.java }}

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install . pytest flake8

    - name: Lint
      run: flake8 redshift_connector_bade tests setup.py --max-line-length=127

    - name: Test
      run: pytest -v

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Build the package
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check dist/*

    - name: The wheel must contain every bundled jar
      run: |
        python - <<'EOF'
        import glob, zipfile
        source = len(glob.glob("redshift_connector_bade/jars/*.jar"))
        wheel = sum(n.endswith(".jar") for n in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
        assert source > 0 and source == wheel, (source, wheel)
        EOF

    - name: Keep the built files
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    # 只有 push v* 的 tag 才發行，而且測試與打包都要先通過
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Get the built files
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: The tag must match the package version
      run: |
        version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' redshift_connector_bade/__init__.py)
        test "v$version" = "$GITHUB_REF_NAME"

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/* install.bat --title "$GITHUB_REF_NAME" --generate-notes

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}  # Set your PyPI username
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}  # Set your PyPI password
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::warning::PYPI_PASSWORD secret is not set, skipped the PyPI upload."
          exit 0
        fi
        pip install twine
        twine upload dist/*
